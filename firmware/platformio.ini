; Bench Breathe firmware — ESP32-C3-WROOM-02-N4 (U1 on hardware/kicad/bench-breathe.kicad_sch)
;
; Two environments, per the portable-core pattern:
;   esp32c3  — device build (Arduino framework, RISC-V)
;   native   — host unit tests over the portable core in src/core (no Arduino includes)
;
; Toolchain pins (verified on PlatformIO Core 6.1.18, see firmware/README.md):
; bumping any pin requires re-running BOTH `pio test -e native` and
; `pio run -e esp32c3` and refreshing the quoted output in firmware/README.md.

[platformio]
default_envs = esp32c3
test_dir = test

[env:esp32c3]
platform = espressif32@6.10.0
framework = arduino
board = esp32-c3-devkitm-1
board_build.f_flash = 80000000L
board_build.flash_size = 4MB
; Arduino ESP32 core 2.x defaults to -std=gnu++11; C++17 needs the unflag.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:native]
platform = native@1.2.1
build_flags = -std=gnu++17 -DNATIVE_TEST
build_src_filter = +<*> -<main.cpp> -<device_hal.h> -<device_hal.cpp>
test_build_src = yes
